<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b3d4ff"><title>Sanad</title><style>:root{color:#f2f5fa;background:#090c12;color-scheme:dark;font:16px/1.8 system-ui,sans-serif}*{box-sizing:border-box}body{max-width:760px;margin:auto;padding:30px 24px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:18px}header img{width:44px}button,a,select{font:inherit;min-height:48px;border-radius:13px;padding:10px 16px;border:1px solid #ffffff30;color:#d3e7ff;background:#172334}button{cursor:pointer}button:disabled{opacity:.5}h1{font-size:2.8rem;letter-spacing:-.05em;font-weight:500;line-height:1.2}h2{font-weight:500}section{margin-top:36px;border-top:1px solid #ffffff20;padding-top:26px}p{color:#a2aebe}.controls{display:flex;gap:10px;flex-wrap:wrap}output{display:block;font-size:1.6rem;color:#b3d4ff;min-height:80px}a{display:inline-block;text-decoration:none}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #b3d4ff;outline-offset:4px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style><header><img src="/sanad/icon.svg" alt=""><strong>Sanad</strong><select id="language" aria-label="Langue / Language / اللغة"><option value="fr">Français</option><option value="ar">العربية</option><option value="en">English</option></select></header><main><h1 id="title"></h1><p id="notice"></p><a href="/sanad" id="retry"></a><section><h2 id="breathingTitle"></h2><p id="breathingDescription"></p><output id="phase" role="status" aria-live="polite"></output><div class="controls"><button id="start" type="button"></button><button id="pause" type="button" disabled></button><button id="stop" type="button" disabled></button></div><p id="stopAdvice"></p></section><section><h2 id="groundingTitle"></h2><p id="groundingDescription"></p><output id="grounding" aria-live="polite"></output><button id="next" type="button"></button></section
