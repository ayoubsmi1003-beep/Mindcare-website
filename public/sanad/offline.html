<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ff"><title>MindCare Aftercare</title>
<style>
:root{color:#252039;background:#f7f5ff;color-scheme:light;--surface:#ffffffc9;--line:#e6e0f6;--muted:#6b647d;--accent:#6c5ce7;font:16px/1.7 system-ui,sans-serif}
*{box-sizing:border-box}body{max-width:900px;margin:auto;padding:28px 22px 72px;background:radial-gradient(ellipse at 15% 0,#bdaeff26,transparent 50%)}header{display:flex;align-items:center;gap:12px;margin-bottom:56px}header img{width:44px;height:44px;border-radius:14px}header strong{font-size:14px;line-height:1.35}header span{display:block;color:var(--muted);font-size:12px;font-weight:400}header select{margin-inline-start:auto;max-width:150px}
button,a,select{font:inherit;min-width:44px;min-height:48px;border-radius:16px;padding:10px 16px;border:1px solid var(--line);color:inherit;background:var(--surface)}button{cursor:pointer}button:disabled{opacity:.45}h1{max-width:600px;font-size:clamp(2.25rem,7vw,3.5rem);letter-spacing:-.045em;font-weight:600;line-height:1.12;margin:0 0 18px}h2{font-size:1.25rem;font-weight:600;line-height:1.3;margin:0 0 10px}p{color:var(--muted);margin:0 0 20px}.intro{max-width:640px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:36px}section{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px}section:first-child{grid-column:1/-1;background:linear-gradient(120deg,#6c5ce711,#bbaaff14)}.controls{display:flex;gap:10px;flex-wrap:wrap}output{display:block;font-size:1.35rem;color:var(--accent);min-height:76px}a{display:inline-block;text-decoration:none;background:var(--accent);color:#fff;border:0}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}#review{font-size:13px;margin-top:28px}#stopAdvice{font-size:14px;margin:16px 0 0}
@media(max-width:560px){header{margin-bottom:40px}.grid{grid-template-columns:1fr}section{padding:22px}header select{padding-inline:8px;max-width:120px}}
@media(prefers-color-scheme:dark){:root{color:#f2edff;background:#12111c;color-scheme:dark;--surface:#1d1b2ae6;--line:#353044;--muted:#b8b0ca;--accent:#b8a4ff}a{color:#21183d}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header><img src="/sanad/icon.svg" alt=""><strong>MindCare<span>Aftercare</span></strong><select id="language" aria-label="Langue / Language / اللغة"><option value="fr">Français</option><option value="ar">العربية</option><option value="en">English</option></select></header>
<main><div class="intro"><h1 id="title"></h1><p id="notice"></p><a href="/sanad" id="retry"></a></div>
<div class="grid">
<section><h2 id="breathingTitle"></h2><p id="breathingDescription"></p><output id="phase" role="status" aria-live="polite"></output><div class="controls"><button id="start" type="button"></button><button id="pause" type="button" disabled></button><button id="stop" type="button" disabled></button></div><p id="stopAdvice"></p></section>
<section><h2 id="groundingTitle"></h2><p id="groundingDescription"></p><output id="grounding" aria-live="polite"></output><button id="next" type="button"></button></section>
<section><h2 id="sleepTitle"></h2><p id="sleepDescription"></p></section>
<section><h2 id="prepareTitle"></h2><p id="prepareDescription"></p></section>
<section><h2 id="helpTitle"></h2><p id="helpDescription"></p></section>
</div><p id="review"></p></main>
<script src="/sanad/offline.js" defer></script>
</body></html>
